<style>
/* Layout: Chatsworth-style. Light uppercase sans headings with wide tracking, stone bands, deep blue masthead, thin square buttons, lots of air. */
:root{
  --blue:#0a3c4b; --blue-2:#1d5363; --moss:#55653a; --bracken:#9a5427; --heather:#76587a; --grit:#857a69;
  --bg:#ffffff; --sheet:#ffffff; --stone:#e6e4db; --fg:#111111; --muted:#5c6366; --rule:#d9d6cb; --ink:var(--blue);
  --onblue:#ffffff; --onblue-dim:#a9c0c6; --field:#f4f3ee;
  --sans:"Jost","Avenir Next","Century Gothic","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1416;--sheet:#0c1416;--stone:#162125;--fg:#ecebe6;--muted:#a3abad;--rule:#26353a;--ink:#9cc3cf;--field:#121c1f;
  --grit:#b0a592;--heather:#b597b8;--bracken:#d38b56;--moss:#a1b27a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1416;--sheet:#0c1416;--stone:#162125;--fg:#ecebe6;--muted:#a3abad;--rule:#26353a;--ink:#9cc3cf;--field:#121c1f;
  --grit:#b0a592;--heather:#b597b8;--bracken:#d38b56;--moss:#a1b27a;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:400 17px/1.7 var(--sans)}
a{color:var(--ink)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--sans);margin:0;text-wrap:balance;line-height:1.25;font-weight:300;letter-spacing:.06em;text-transform:uppercase}
p{margin:0;max-width:66ch}
.label{font-size:.72rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
:focus-visible{outline:2px solid var(--bracken);outline-offset:2px}

.preview{background:var(--stone);color:var(--fg);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding-block:6px}
.top{background:var(--blue);color:var(--onblue);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .inner{display:flex;align-items:center;gap:24px;padding-block:18px;flex-wrap:wrap}
.brand{font-weight:300;font-size:1.35rem;letter-spacing:.2em;text-transform:uppercase;color:var(--onblue);text-decoration:none;line-height:1}
.brand small{display:block;font-size:.58rem;font-weight:400;letter-spacing:.24em;color:var(--onblue-dim);margin-top:6px}
nav{display:flex;gap:4px 26px;flex-wrap:wrap;margin-left:auto}
nav a{color:var(--onblue);text-decoration:none;font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:4px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:var(--onblue)}

.hero{background:var(--blue);color:var(--onblue);position:relative;overflow:hidden}
.hero svg.contours{display:none}
.hero .inner{position:relative;padding-block:88px 80px;display:grid;gap:22px;justify-items:center;text-align:center}
.hero h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:300;letter-spacing:.08em;line-height:1.15;max-width:22ch}
.hero p{font-size:1.1rem;font-weight:300;opacity:.92;max-width:52ch}
.hero .label{color:var(--onblue-dim)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.btn{display:inline-block;font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:13px 24px;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;cursor:pointer}
.hero .btn{background:#fff;color:var(--blue);border-color:#fff}
.btn.ghost,.hero .btn.ghost{background:transparent;border-color:currentColor;color:inherit}
.btn:hover{opacity:.88}

main{padding-block:0 0}
.sheet{background:var(--sheet)}
.block{padding:64px clamp(16px,4vw,40px);display:grid;gap:28px}
.block:nth-child(even){background:var(--stone)}
.head{display:grid;gap:10px;justify-items:center;text-align:center}
.head .label{color:var(--muted)}
.head h2{font-size:clamp(1.5rem,3.6vw,2.1rem);color:var(--ink)}
.intro{color:var(--muted);font-weight:300;font-size:1.05rem}
.block > .intro{justify-self:center;text-align:center}
.pagehead{padding:64px clamp(16px,4vw,40px) 44px;display:grid;gap:14px;justify-items:center;text-align:center;background:var(--stone)}
.pagehead h1{font-size:clamp(1.8rem,5vw,2.9rem);color:var(--ink)}
.crumbs{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.crumbs a{color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.tile{display:grid;gap:10px;padding:28px 22px;text-decoration:none;color:var(--fg);background:var(--sheet);justify-items:center;text-align:center}
.block:nth-child(even) .tile{background:var(--stone)}
.tile:hover{background:var(--field)}
.tile svg{width:72px;height:54px;stroke:var(--ink);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.tile h3{font-size:1rem;letter-spacing:.12em}
.tile span{font-size:.9rem;color:var(--muted);font-weight:300}
.tile .count{font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--bracken)}

.makers{display:grid;border-top:1px solid var(--rule)}
.maker{display:grid;grid-template-columns:170px 1fr auto;gap:24px;padding:26px 0;border-bottom:1px solid var(--rule);align-items:start}
.maker > *{min-width:0}
.ph{aspect-ratio:4/3;max-width:100%;background:var(--stone);display:grid;place-items:center;text-align:center;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:8px}
.maker h3{font-size:1.05rem;letter-spacing:.1em}
.maker .loc{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.maker p{font-weight:300}
.maker .price{font-weight:500;font-size:1rem;color:var(--fg);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.maker .price small{display:block;font-weight:400;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.maker .act{display:grid;gap:12px;justify-items:end}
@media (max-width:640px){.maker{grid-template-columns:96px 1fr}.maker .act{grid-column:1/-1;justify-items:start}.maker .price{text-align:left}}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.twocol > *{min-width:0}
@media (max-width:760px){.twocol{grid-template-columns:1fr}}
.notes{display:grid;gap:10px}
.notes .label{color:var(--moss)}
.notes ul{margin:0;padding-left:1.1em;font-weight:300}

.glist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.glist li{border-bottom:1px solid var(--rule)}
.glist a{display:grid;grid-template-columns:1fr auto;gap:16px;padding:18px 0;text-decoration:none;color:var(--fg)}
.glist h3{font-size:.98rem;letter-spacing:.06em;line-height:1.4}
.glist p{color:var(--muted);font-size:.94rem;font-weight:300}
.glist .go{font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);align-self:center}

.article{display:grid;gap:18px;max-width:70ch;justify-self:center;font-weight:300}
.article h3{font-size:1.1rem;letter-spacing:.1em;color:var(--ink);margin-top:14px;font-weight:400}
.article ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.article .src{font-size:.85rem;color:var(--muted)}
.article .aside{background:var(--stone);padding:16px 18px;font-size:.95rem}
.related{display:flex;flex-wrap:wrap;gap:10px}
.related a{font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--ink);color:var(--ink);text-decoration:none}

.bundles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.bundle{padding:30px 26px;background:var(--sheet);display:grid;gap:14px;align-content:start}
.bundle h3{font-size:1.15rem;letter-spacing:.12em;color:var(--ink)}
.bundle ol{margin:0;padding-left:1.2em;display:grid;gap:4px;font-weight:300}

.calc{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:var(--stone);padding:24px}
.calc > *{min-width:0}
.calc label{display:grid;gap:6px;font-size:.72rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.calc input{font:inherit;font-size:1rem;letter-spacing:0;text-transform:none;font-weight:400;padding:10px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--fg);width:100%}
.out{display:grid;gap:14px;align-content:start}
.out div{border-bottom:1px solid var(--rule);padding-bottom:10px}
.out b{display:block;font-size:1.9rem;font-weight:300;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.out span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){.calc{grid-template-columns:1fr}}

form.enq{display:grid;gap:14px;max-width:560px;width:100%;justify-self:center}
form.enq label{display:grid;gap:6px;font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
form.enq input,form.enq select,form.enq textarea{font:inherit;font-size:1rem;letter-spacing:0;text-transform:none;font-weight:400;padding:11px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--fg);width:100%}
.ok{padding:12px 14px;background:var(--stone);font-weight:300}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px;text-align:center}
.strip div{display:grid;gap:8px}
.strip b{font-weight:400;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.strip span{color:var(--muted);font-size:.95rem;font-weight:300}

footer{background:var(--blue);color:var(--onblue-dim);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
footer .inner{padding-block:36px;display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between}
footer a{color:var(--onblue)}

.pl-top{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.pl-top label{display:grid;gap:6px;font-size:.72rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.pl-top input{font:inherit;font-size:1rem;letter-spacing:0;padding:10px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--fg);width:120px}
.pl-wrap{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.pl-wrap > *{min-width:0}
.pl-add{display:grid;gap:6px}
.pl-btn{font:inherit;text-align:left;padding:9px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--fg);cursor:pointer;display:grid;gap:2px;font-size:.92rem}
.pl-btn small{color:var(--muted);font-size:.75rem}
.pl-btn:hover{border-color:var(--ink)}
.pl-stage{display:grid;gap:10px}
#pl-svg{width:100%;height:auto;max-height:70vh;background:var(--field);border:1px solid var(--rule);touch-action:none;user-select:none}
.pl-field{fill:#dfe6d2;stroke:var(--moss);stroke-width:.15}
.pl-grid{stroke:var(--moss);stroke-width:.04;opacity:.5}
.pl-item rect,.pl-item circle{fill:var(--stone);stroke:var(--grit);stroke-width:.12;cursor:grab}
.pl-item.unit rect,.pl-item.unit circle{fill:#fff;stroke:var(--blue)}
.pl-item.close rect,.pl-item.close circle{stroke:#b3261e;stroke-width:.3}
.pl-item.sel rect,.pl-item.sel circle{stroke:var(--bracken);stroke-width:.35}
.pl-item text,.pl-scale{fill:#17242a;text-anchor:middle;font-family:var(--sans);pointer-events:none}
.pl-scale{text-anchor:start;fill:var(--muted)}
.pl-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pl-bar b{font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;margin-right:6px}
.pl-hint{font-size:.85rem;color:var(--muted)}
.pl-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.pl-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-weight:300}
.pl-list a{font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
@media (max-width:760px){.pl-wrap{grid-template-columns:1fr}.pl-add{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

</head>

const GUIDES = [
 {id:'checklist',t:'The glamping compliance checklist: everything to sort before your first guest',s:'Planning, licences, safety checks, insurance and paperwork, in the order most people tackle them.',cats:['shepherd-huts','glamping-pods','hot-tubs'],b:`
<p>Opening a hut or pod to paying guests brings in rules on planning, fire, electrics, gas, water and insurance. This list covers what applies to most small sites in England. Wales, Scotland and Northern Ireland have their own versions of several of these rules, so check with your council if you are outside England.</p>
<h3>Before you buy</h3>
<ul><li>Speak to your local planning authority. Most permanent glamping units need planning permission. See the planning guide.</li><li>Check whether a unit on wheels counts as a caravan where you are, because that can bring in a caravan site licence.</li><li>Check your insurer will cover paying guests on the land.</li></ul>
<h3>Before you open</h3>
<ul><li>Write a fire risk assessment. The law requires one for any paying guest accommodation.</li><li>Fit smoke alarms, and a carbon monoxide alarm wherever there is a stove or gas appliance.</li><li>Get the fixed wiring inspected and keep the certificate.</li><li>PAT test the portable appliances you supply to guests.</li><li>Get gas appliances checked by a Gas Safe registered engineer.</li><li>If the water comes from a private supply, tell your council, which may need to risk assess and test it.</li><li>If you have a hot tub, write a risk assessment and a water testing routine.</li><li>Arrange public liability insurance.</li></ul>
<h3>Every year</h3>
<ul><li>Review the fire risk assessment.</li><li>Renew the gas safety check.</li><li>Re-test portable appliances at the interval your risk assessment sets.</li><li>Have stove flues swept.</li></ul>
<div class="aside">Rules vary between councils, so check the details for your site.</div>`},
 {id:'electrical',t:'Electrical safety for shepherd huts and pods: PAT testing, inspections and hook-ups',s:'What needs testing, how often, and what to ask for at handover.',cats:['shepherd-huts','glamping-pods','saunas'],b:`
<p>When you let a hut or pod to paying guests, the Electricity at Work Regulations 1989 put a duty on you to keep the electrics safe. In practice that means two kinds of check.</p>
<h3>The fixed installation</h3>
<p>The wiring, consumer unit, sockets and the supply cable from your house or hook-up post are the fixed installation. A qualified electrician inspects these and issues an Electrical Installation Condition Report, known as an EICR. When a new hut arrives, ask for its electrical installation certificate and keep it with your safety paperwork.</p>
<h3>Portable appliances</h3>
<p>Kettles, toasters, heaters, lamps and anything else guests can plug in are portable appliances. PAT testing is the usual way to show they are safe. How often depends on your risk assessment, but holiday lets commonly test once a year because guests move appliances around and use them hard.</p>
<h3>Outdoor supplies</h3>
<ul><li>Supply cables to a field need to be suitable for burial or protected from damage.</li><li>Outdoor sockets and hot tub supplies need RCD protection.</li><li>Keep a record of every test with the date and the result.</li></ul>
<div class="aside"><a href="#pat-testing">Book a PAT test</a> for your huts and pods.</div>`},
 {id:'fire',t:'Fire safety for glamping: your fire risk assessment explained',s:'The Fire Safety Order, alarms, extinguishers, escape routes and spacing between units.',cats:['shepherd-huts','glamping-pods','stoves'],b:`
<p>The Regulatory Reform (Fire Safety) Order 2005 applies to paying guest accommodation in England and Wales, including huts and pods. It makes the owner or operator the "responsible person", who must carry out a fire risk assessment and act on it.</p>
<h3>What the assessment covers</h3>
<ul><li>What could start a fire, such as stoves, ovens, heaters, candles and barbecues.</li><li>Who is at risk, including guests who do not know the site.</li><li>How guests are warned, usually through smoke alarms.</li><li>How they get out, and whether doors open easily from inside.</li><li>What firefighting equipment is provided, such as a fire blanket and an extinguisher.</li></ul>
<h3>Spacing</h3>
<p>Timber units need space between them so a fire in one does not spread to the next. Councils and fire services often ask about separation distances, so agree your layout with them before units arrive.</p>
<p>The government publishes a guide on fire safety in small paying guest accommodation, which is a sensible place to start before writing your own assessment.</p>`},
 {id:'planning',t:'Do I need planning permission for a shepherd hut or glamping pod?',s:'The 28 and 60 day rules, caravan site licences, and when to speak to the council.',cats:['shepherd-huts','glamping-pods','communal'],b:`
<p>In most cases, yes. Placing a hut or pod in a field and letting it out year round usually counts as a change of use of the land, and that needs planning permission.</p>
<h3>The temporary use rules</h3>
<p>In England, permitted development rules allow land to be used temporarily for some purposes, including camping, for a limited number of days a year without a planning application. The limits and conditions vary, and they are written mainly with tents in mind. They rarely cover a hut or pod that stays on site.</p>
<h3>Huts on wheels</h3>
<p>A hut on wheels may meet the legal definition of a caravan. If it does, you may need a caravan site licence from the council as well as planning permission.</p>
<h3>What to do</h3>
<ul><li>Ask your council for pre-application advice before buying.</li><li>Check for anything that tightens the rules, such as a National Park, an Area of Outstanding Natural Beauty or a listed building nearby.</li><li>Think about access, parking, drainage and neighbours, because those are the points councils most often raise.</li></ul>
<div class="aside">Rules vary between councils, so check the details for your site.</div>`},
 {id:'earnings',t:'What could a glamping unit earn? Costs, nightly rates and payback',s:'Work it out for a shepherd hut, pod, tent or cabin with the calculator.',cats:['shepherd-huts','glamping-pods','hot-tubs'],calc:true,b:`
<p>Earnings depend on your location, nightly rate, the number of nights you let and what each stay costs you. Put your own figures into the calculator below.</p>`},
 {id:'stoves',t:'Wood burners in huts: safe installation, carbon monoxide alarms and HETAS',s:'Flue clearances, Building Regulations Part J and instructions for guests.',cats:['stoves','shepherd-huts'],b:`
<p>A stove in a small timber building needs careful installation, because heat and carbon monoxide build up quickly in a small space.</p>
<h3>Who fits it</h3>
<p>Building Regulations Part J covers stoves and flues. The simplest route is a HETAS-registered installer, who can self-certify the work. Otherwise you need to notify building control.</p>
<h3>Carbon monoxide</h3>
<p>Installing a new solid fuel appliance brings a requirement for a carbon monoxide alarm in the same room. Test it before every stay.</p>
<h3>For guests</h3>
<ul><li>Leave clear written instructions on lighting, refuelling and the air controls.</li><li>Supply dry, seasoned wood.</li><li>Have the flue swept at least once a year, and more often in heavy use.</li></ul>`},
 {id:'hot-tubs',t:'Hot tubs at holiday lets: hygiene, Legionella and the HSE guidance',s:'Water testing, cleaning records and what guests should be told.',cats:['hot-tubs','shelters'],b:`
<p>A hot tub at a holiday let counts as a commercial spa pool. The Health and Safety Executive's guidance, HSG282, sets out how to control Legionella and other bacteria in spa pools used by the public.</p>
<h3>What it means in practice</h3>
<ul><li>Write a risk assessment for the tub.</li><li>Test the water regularly and keep a written record.</li><li>Drain, clean and refill between guests, or follow the treatment routine your risk assessment sets.</li><li>Keep filters clean and replace them on schedule.</li></ul>
<h3>Wood-fired tubs</h3>
<p>Many wood-fired tubs are filled fresh for each stay, which makes hygiene simpler, but you still need to clean them properly and record that you did.</p>
<h3>For guests</h3>
<p>Leave rules on use, including advice for children and anyone with health conditions, and say who to call if something goes wrong.</p>`},
 {id:'hut-or-pod',t:'Shepherd hut, glamping pod or cabin: which should you buy?',s:'How they compare on price, planning, lifespan and what guests expect.',cats:['shepherd-huts','glamping-pods'],b:`
<p>All three can work. The right one depends on your land, your budget and how many units you plan to run.</p>
<h3>Shepherd huts</h3>
<p>A hut suits a single pitch and has a strong identity, so it photographs well on booking sites. Most sit on wheels, which affects planning and licensing, as the planning guide explains.</p>
<h3>Glamping pods</h3>
<p>Pods suit a row of units on a larger site. Many come with a bathroom and kitchenette built in, which saves building a separate shower block.</p>
<h3>Cabins</h3>
<p>Cabins give the most space and suit families, but they are more likely to be treated as permanent buildings by planners.</p>
<p>Whichever you choose, check what is included, what the base and services cost, and how long delivery takes.</p>`},
 {id:'gas-water',t:'Gas, water and waste: LPG safety, private water supplies and toilets',s:'Gas Safe checks, council water testing and off-grid options.',cats:['glamping-pods','shepherd-huts'],b:`
<h3>Gas</h3>
<p>If a unit has an LPG hob, heater or boiler, the Gas Safety (Installation and Use) Regulations 1998 apply to letting it. Appliances need a safety check every year by a Gas Safe registered engineer, and you keep the record.</p>
<h3>Water</h3>
<p>If your water comes from a borehole, well or spring, it counts as a private supply. Once paying guests use it, your council may need to risk assess it and test it. Tell them before you open.</p>
<h3>Waste</h3>
<p>A toilet or shower in a unit needs somewhere for the waste to go. Options include connecting to the mains sewer, a septic tank or treatment plant, or composting toilets. Discharges to ground or water come under Environment Agency rules, so check before you install.</p>`},
 {id:'money',t:'Insurance, business rates and tax for glamping sites',s:'What usually applies to a small site, and when to call an accountant.',cats:['shepherd-huts','glamping-pods'],b:`
<h3>Insurance</h3>
<p>Standard farm or home insurance often excludes paying guests. You will usually need cover for the units themselves and public liability insurance for guests on the land.</p>
<h3>Business rates</h3>
<p>In England, a self-catering unit is generally assessed for business rates rather than council tax if it is available to let for at least 140 days a year and actually let for at least 70. Small business rates relief may reduce the bill.</p>
<h3>Tax</h3>
<p>The furnished holiday lettings tax regime was abolished from April 2025, which changed how holiday let income is taxed. Income from huts and pods counts toward your turnover for VAT purposes too.</p>
<div class="aside">Speak to an accountant about your own situation.</div>`}
];

 {id:'news-short-let-register',d:'13 October 2026',tag:'Industry news',t:'Short-let register for England now expected in March 2027',s:'Every glamping unit let to guests is likely to need registering.',cats:['shepherd-huts','glamping-pods','tents'],b:`

}
const PITEMS=[
 {k:'hut',n:'Shepherd hut',w:6,h:2.5,cat:'shepherd-huts',unit:1},
 {k:'pod',n:'Glamping pod',w:5,h:3,cat:'glamping-pods',unit:1},
 {k:'bell',n:'Bell tent',d:5,cat:'tents',unit:1},
 {k:'safari',n:'Safari tent',w:7,h:5,cat:'tents',unit:1},
 {k:'tub',n:'Hot tub',d:2,cat:'hot-tubs'},
 {k:'shelter',n:'Hot tub shelter',w:3,h:3,cat:'shelters'},
 {k:'sauna',n:'Sauna',w:2.5,h:2.2,cat:'saunas'},
 {k:'gazebo',n:'Oak gazebo',w:4,h:4,cat:'communal'},
 {k:'kitchen',n:'Outdoor kitchen',w:3,h:1,cat:'communal'},
 {k:'oven',n:'Wood-fired oven',w:1.5,h:1.5,cat:'communal'},
 {k:'bench',n:'Picnic bench',w:2,h:1.5,cat:'communal'},
 {k:'fire',n:'Fire pit',d:1.2},
 {k:'park',n:'Parking space',w:2.5,h:5},
 {k:'block',n:'Toilet and shower block',w:4,h:3}
];
const PI=k=>PITEMS.find(p=>p.k===k);
const GAP=6;
let plan=null, sel=null;
function loadPlan(){try{const s=JSON.parse(localStorage.getItem('tge-plan')||'null');if(s&&s.W)return s}catch(e){}return {W:60,L:40,items:[{id:1,k:'hut',x:15,y:12,r:0},{id:2,k:'tub',x:20,y:12,r:0},{id:3,k:'pod',x:35,y:12,r:0},{id:4,k:'gazebo',x:28,y:28,r:0},{id:5,k:'fire',x:28,y:34,r:0}],next:6}}
function savePlan(){try{localStorage.setItem('tge-plan',JSON.stringify(plan))}catch(e){}}
function dims(it){const p=PI(it.k);if(p.d)return{w:p.d,h:p.d,c:1};return it.r%180?{w:p.h,h:p.w}:{w:p.w,h:p.h}}
function box(it){const d=dims(it);return{x1:it.x-d.w/2,y1:it.y-d.h/2,x2:it.x+d.w/2,y2:it.y+d.h/2}}
function gap(a,b){const A=box(a),B=box(b);const dx=Math.max(0,B.x1-A.x2,A.x1-B.x2),dy=Math.max(0,B.y1-A.y2,A.y1-B.y2);return Math.hypot(dx,dy)}
function plannerView(){
  return page('Plan your site','Plan your glamping site','Enter your field size, then add huts, tents, hot tubs and more to see how your site could look.',`<section class="block">
<div class="pl-top"><label for="pl-w">Field width (m)<input id="pl-w" type="number" min="5" max="500"></label><label for="pl-l">Field length (m)<input id="pl-l" type="number" min="5" max="500"></label><button class="btn ghost" type="button" id="pl-set">Set field</button><button class="btn ghost" type="button" id="pl-clear">Clear field</button></div>
<div class="pl-wrap"><div class="pl-add"><span class="label" style="color:var(--muted)">Add to your field</span>${PITEMS.map(p=>`<button type="button" class="pl-btn" data-add="${p.k}">${p.n}<small>${p.d?p.d+' m across':p.w+' × '+p.h+' m'}</small></button>`).join('')}</div>
<div class="pl-stage"><svg id="pl-svg" role="img" aria-label="Plan of your field"></svg>
<div class="pl-bar" id="pl-bar" hidden><b id="pl-name"></b><button type="button" class="btn ghost" id="pl-rot">Rotate</button><button type="button" class="btn ghost" id="pl-del">Remove</button><a class="btn" id="pl-shop" href="#shop">Shop</a></div>
<p class="pl-hint">Drag items to move them. Tap an item to rotate or remove it. Sizes are typical and vary by model.</p></div></div>
<div class="twocol" style="margin-top:8px"><div><div class="head" style="justify-items:start;text-align:left"><span class="label">On your plan</span></div><ul class="pl-list" id="pl-list"></ul></div>
<div class="notes"><span class="label">Spacing</span><p>Caravan site licences usually ask for 6 metres between units, and councils often apply the same to glamping. Units closer than that are outlined in red. Check the rules with your council.</p><p><a href="#planning">Planning guide</a> · <a href="#fire">Fire safety guide</a></p></div></div>
</section>`);
}
function drawPlan(){
  const svg=document.getElementById('pl-svg');if(!svg)return;
  const {W,L}=plan;svg.setAttribute('viewBox',`-1 -1 ${W+2} ${L+2}`);
  let g='';for(let x=0;x<=W;x+=5)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${L}" class="pl-grid"/>`;for(let y=0;y<=L;y+=5)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" class="pl-grid"/>`;
  const units=plan.items.filter(i=>PI(i.k).unit);const close=new Set();
  for(let i=0;i<units.length;i++)for(let j=i+1;j<units.length;j++)if(gap(units[i],units[j])<GAP){close.add(units[i].id);close.add(units[j].id)}
  const fs=Math.max(0.6,Math.min(W,L)/45);
  const items=plan.items.map(it=>{const p=PI(it.k),d=dims(it);const cls=`pl-item${p.unit?' unit':''}${close.has(it.id)?' close':''}${sel===it.id?' sel':''}`;
    const shape=d.c?`<circle cx="${it.x}" cy="${it.y}" r="${d.w/2}"/>`:`<rect x="${it.x-d.w/2}" y="${it.y-d.h/2}" width="${d.w}" height="${d.h}"/>`;
    return `<g class="${cls}" data-id="${it.id}">${shape}<text x="${it.x}" y="${it.y+(d.h/2)+fs*1.2}" font-size="${fs}">${esc(p.n)}</text></g>`}).join('');
  svg.innerHTML=`<rect x="0" y="0" width="${W}" height="${L}" class="pl-field"/>${g}${items}<text x="0" y="${L+0.9}" font-size="${fs*0.9}" class="pl-scale">Grid squares are 5 m · Field ${W} × ${L} m</text>`;
  const list=document.getElementById('pl-list');
  const counts={};plan.items.forEach(i=>counts[i.k]=(counts[i.k]||0)+1);
  list.innerHTML=Object.keys(counts).length?Object.entries(counts).map(([k,n])=>{const p=PI(k);return `<li><span>${n} × ${esc(p.n)}</span>${p.cat?`<a href="#${p.cat}">Shop</a>`:''}</li>`}).join(''):'<li>Your field is empty. Add something from the list.</li>';
  const bar=document.getElementById('pl-bar');const s=plan.items.find(i=>i.id===sel);bar.hidden=!s;
  if(s){const p=PI(s.k);document.getElementById('pl-name').textContent=p.n;document.getElementById('pl-rot').hidden=!!p.d;const sh=document.getElementById('pl-shop');sh.hidden=!p.cat;if(p.cat)sh.href='#'+p.cat}
  savePlan();
}
function initPlanner(){
  plan=loadPlan();sel=null;
  const w=document.getElementById('pl-w'),l=document.getElementById('pl-l');w.value=plan.W;l.value=plan.L;
  document.getElementById('pl-set').onclick=()=>{const W=Math.min(500,Math.max(5,+w.value||0)),L=Math.min(500,Math.max(5,+l.value||0));plan.W=W;plan.L=L;plan.items.forEach(i=>{i.x=Math.min(i.x,W);i.y=Math.min(i.y,L)});drawPlan()};
  document.getElementById('pl-clear').onclick=()=>{plan.items=[];sel=null;drawPlan()};
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const it={id:plan.next++,k:b.dataset.add,x:plan.W/2,y:plan.L/2,r:0};plan.items.push(it);sel=it.id;drawPlan()});
  document.getElementById('pl-rot').onclick=()=>{const s=plan.items.find(i=>i.id===sel);if(s){s.r=(s.r+90)%360;drawPlan()}};
  document.getElementById('pl-del').onclick=()=>{plan.items=plan.items.filter(i=>i.id!==sel);sel=null;drawPlan()};
  const svg=document.getElementById('pl-svg');let drag=null;
  const pt=e=>{const m=svg.getScreenCTM().inverse();const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return p};
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.pl-item');if(!g){sel=null;drawPlan();return}
    const it=plan.items.find(i=>i.id===+g.dataset.id);const p=pt(e);drag={it,dx:it.x-p.x,dy:it.y-p.y};sel=it.id;svg.setPointerCapture(e.pointerId);drawPlan();e.preventDefault()});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),d=dims(drag.it);
    drag.it.x=Math.round(Math.min(plan.W-d.w/2,Math.max(d.w/2,p.x+drag.dx))*10)/10;drag.it.y=Math.round(Math.min(plan.L-d.h/2,Math.max(d.h/2,p.y+drag.dy))*10)/10;drawPlan()});
  const end=()=>{drag=null};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  drawPlan();
}

function runCalc(){
  const v=id=>+document.getElementById(id).value||0;
  const inc=v('c-rate')*v('c-nights'), prof=inc-v('c-var')*v('c-nights')-v('c-fixed');
  const f=n=>'£'+Math.round(n).toLocaleString('en-GB');
  document.getElementById('o-inc').textContent=f(inc);
  document.getElementById('o-prof').textContent=f(prof);
  document.getElementById('o-pay').textContent=prof>0?(v('c-price')/prof).toFixed(1)+' years':'Does not pay back';
}
function render(){
  const r=(location.hash.slice(1)||'home');
  const c=cat(r), g=guide(r), n=post(r);
  app.innerHTML=c?catView(c):g?guideView(g):n?newsView(n):(V[r]||V.home)();
  document.getElementById('nav').innerHTML=NAV.map(([id,l])=>`<a href="#${id}"${(id===r||(id==='shop'&&c)||(id==='advice'&&g)||(id==='safety'&&r==='pat-testing')||(id==='news'&&n))?' aria-current="page"':''}>${l}</a>`).join('');
  if(document.getElementById('pl-svg'))initPlanner();
  if(document.getElementById('c-price')){app.querySelectorAll('.calc input').forEach(i=>i.addEventListener('input',runCalc));runCalc()}
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-enq]');if(a){enquiryFor=a.dataset.enq;if(location.hash==='#enquire')render()}});
document.addEventListener('submit',e=>{const f=e.target.closest('form.enq');if(!f)return;e.preventDefault();f.querySelector('.ok').hidden=false});
window.addEventListener('hashchange',render);
render();
</script>
